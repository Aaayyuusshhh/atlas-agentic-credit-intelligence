e-opacity=".7"/><text x="909.9" y="120.9" text-anchor="middle" font-size="12" font-weight="700" fill="#eef1fb">Valuation</text></g><g class="cr" style="animation-duration:22s;transform-origin:1113.6px 139.9px"><rect x="1094.5" y="126.9" width="38.2" height="26" rx="13" fill="#11152a" stroke="url(#gr)" stroke-opacity=".7"/><text x="1113.6" y="144.4" text-anchor="middle" font-size="12" font-weight="700" fill="#eef1fb">AML</text></g></g><circle cx="1000" cy="230" r="208" fill="none" stroke="#fff" stroke-opacity=".08" stroke-dasharray="2 6"/><g class="orb" style="animation-duration:34s"><g class="cr" style="animation-duration:34s;transform-origin:952.7px 432.6px"><rect x="933.6" y="419.6" width="38.2" height="26" rx="13" fill="#11152a" stroke="url(#gr)" stroke-opacity=".7"/><text x="952.7" y="437.1" text-anchor="middle" font-size="12" font-weight="700" fill="#eef1fb">IPO</text></g><g class="cr" style="animation-duration:34s;transform-origin:792.8px 247.6px"><rect x="773.7" y="234.6" width="38.2" height="26" rx="13" fill="#11152a" stroke="url(#gr)" stroke-opacity=".7"/><text x="792.8" y="252.1" text-anchor="middle" font-size="12" font-weight="700" fill="#eef1fb">PEP</text></g><g class="cr" style="animation-duration:34s;transform-origin:919.2px 38.3px"><rect x="892.7" y="25.3" width="53.0" height="26" rx="13" fill="#11152a" stroke="url(#gr)" stroke-opacity=".7"/><text x="919.2" y="42.8" text-anchor="middle" font-size="12" font-weight="700" fill="#eef1fb">Legal</text></g><g class="cr" style="animation-duration:34s;transform-origin:1157.3px 93.9px"><rect x="1112.3" y="80.9" width="90.0" height="26" rx="13" fill="#11152a" stroke="url(#gr)" stroke-opacity=".7"/><text x="1157.3" y="98.4" text-anchor="middle" font-size="12" font-weight="700" fill="#eef1fb">Pitch Deck</text></g><g class="cr" style="animation-duration:34s;transform-origin:1178.0px 337.5px"><rect x="1158.9" y="324.5" width="38.2" height="26" rx="13" fill="#11152a" stroke="url(#gr)" stroke-opacity=".7"/><text x="11