<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img">
<style>text{font-family:'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace} .orb{transform-origin:1000px 230px;animation:spin linear infinite}.cr{animation:rspin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rspin{to{transform:rotate(-360deg)}}
.ring{transform-origin:1000px 230px;animation:pu 2.6s ease-out infinite}@keyframes pu{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
.a1{animation:up 1s cubic-bezier(.2,.8,.2,1) both}.a2{animation:up 1s .25s cubic-bezier(.2,.8,.2,1) both}.a3{animation:up 1s .5s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}</style>
