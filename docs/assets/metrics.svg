<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img">
<style>text{font-family:'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace} .c{animation:up .9s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}</style>
